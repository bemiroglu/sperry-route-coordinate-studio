<p data-tr="Haritada WP düzenleme açıkken bir WP'ye tıklamak ad, koordinat, leg geometrisi, hız ve not alanlarını düzenleyen bir pencere açar; koordinat alanları ana parser ile aynı DD/DDM/DMS girişlerini kabul eder. WP sürüklenebilir, silinebilir veya seçili WP'nin sonrasına haritada tıklanarak yeni bir WP eklenebilir. Düzenleme kapalıysa bilgi penceresi yaklaşık 8 saniye sonra kapanır; koordinatlar ana ekrandaki Koordinat gösterimi seçimiyle aynı DD/DDM/DMS biçiminde gösterilir. Leg mesafe ve rota bilgileri waypoint popup'ında değil, leg geometrisinin orta noktasında gösterilir; Akıllı modda sıkışık etiketler gizlenebilir ve rota çizgisine tıklanarak ayrıntılar açılabilir." data-en="With map editing enabled, clicking a waypoint opens an editor for name, coordinates, outbound-leg geometry, speed and notes; coordinate fields accept the same DD/DDM/DMS parser as the main table. A WP can be dragged, deleted, or a new WP can be inserted after the selected WP by clicking the map. With editing disabled, the information popup closes after about 8 seconds; coordinates follow the same DD/DDM/DMS format selected on the main screen. Leg distance and course are shown at the visual midpoint of the leg rather than in the waypoint popup; Smart mode can hide crowded labels and full leg details remain available by clicking the route line."></p>
<p data-tr="Sperry .route dosyalarında doğruladığımız örnekler RhumbLine kullanmaktadır. Great Circle hesaplama ve harita gösterimi desteklenir; ancak Sperry .route içindeki kesin Great Circle tokenı gerçek cihaz örneğiyle doğrulanana kadar GC içeren .route dışa aktarımı engellenir." data-en="Verified Sperry .route samples use RhumbLine. Great Circle calculation and map rendering are supported, but .route export containing GC legs remains blocked until the exact Sperry Great Circle token is verified from a real device file."></p>
</div></div></div>

<div id="crsModal" class="modal"><div class="modal-card"><div class="modal-head"><h2 data-tr="Koordinat Referansı / Datum" data-en="Coordinate Reference / Datum"></h2><div class="spacer"></div><button id="crsClose" class="close">×</button></div><div class="modal-body">
<p data-tr="Bu sürümde kullanıcıdan datum seçmesi istenmez. Tüm çalışma koordinatları tek bir kanonik modelde WGS 84 coğrafi enlem/boylam olarak tutulur. Böylece yalnız görünüşü değiştiren bir seçim kutusu oluşturup gerçekte dönüşüm yapmama riski ortadan kalkar." data-en="This version does not ask the user to choose a datum. All working coordinates are held in one canonical model as WGS 84 geographic latitude/longitude. This avoids exposing a selector that would merely relabel coordinates without performing a real transformation."></p>
<table class="crs-table"><tr><th data-tr="Sistem / format" data-en="System / format"></th><th data-tr="Bu uygulamadaki kullanım" data-en="Use in this application"></th></tr>
<tr><td>WGS 84 — EPSG:4326</td><td data-tr="Kanonik giriş, hesap ve çıktı koordinat referansı." data-en="Canonical coordinate reference for input, calculations and output."></td></tr>
<tr><td>OpenStreetMap / EPSG:3857</td><td data-tr="Yalnız harita karolarının ekranda çizildiği Web Mercator projeksiyonu. WP koordinatlarının datumunu değiştirmez." data-en="Web Mercator projection used only to render map tiles. It does not change the waypoint datum."></td></tr>
<tr><td>GPX 1.1</td><td data-tr="WGS 84 koordinatlarıyla dışa/içe aktarılır." data-en="Imported/exported using WGS 84 coordinates."></td></tr>
<tr><td>KML / KMZ</td><td data-tr="WGS 84 boylam-enlem koordinatlarıyla kullanılır." data-en="Uses WGS 84 longitude-latitude coordinates."></td></tr>
<tr><td>GeoJSON RFC 7946</td><td data-tr="WGS 84/CRS84, ondalıklı derece." data-en="WGS 84/CRS84 in decimal degrees."></td></tr>
<tr><td>Sperry .route</td><td data-tr="Gerçek örneklerde enlem/boylam radyan olarak saklanır; dosya şemasında ayrı bir CRS alanı görülmedi. Bu çalışma hattında WGS 84 kabul edilir." data-en="Real samples store latitude/longitude in radians and expose no separate CRS field in the observed schema. This workflow treats them as WGS 84."></td></tr></table>
<h3 data-tr="İleride eklenebilecek kaynak CRS'ler" data-en="Candidate source CRS for future import"></h3>
<p data-tr="WGS 84 / UTM zonları, eski ED50 / UTM verileri ve ihtiyaç doğarsa TUREF/ITRF tabanlı koordinatlar ayrı bir 'Kaynak CRS' içe aktarma katmanında desteklenebilir. Bu durumda dönüşüm yalnız EPSG/PROJ tanımı veya eşdeğer doğrulanmış parametrelerle yapılmalı; kaynak CRS bilinmiyorsa program tahmin ederek dönüştürmemelidir." data-en="WGS 84 / UTM zones, legacy ED50 / UTM data and, if needed, TUREF/ITRF-based coordinates can later be supported through a dedicated Source CRS import layer. Transformations should use EPSG/PROJ definitions or equivalent verified parameters; unknown source CRS values must never be guessed and transformed silently."></p>
